<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- <META> -->
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="referrer" content="no-referrer">
            <!-- Changed meta tags due to privacy concerns -->
        <!-- </META> -->

        <title>Homepage</title>

        <link rel="stylesheet" href="css/style.css" rel="preload" as="style">

    </head>
    <body>
        <main class="layout">

                <!-- TOP BAR -->
                <div class="top-bar">
                    <button class="settings-btn" onclick="toggleSidebar()">⚙️ Settings</button>
                </div>
            
                <!-- SIDEBAR (fixed to screen) -->
                <aside class="sidebar" id="sidebar">
                    <button class="close-btn" onclick="toggleSidebar()">×</button>
                    <h2>Settings</h2>

                    <br>
                    
                    <div class="widget-toggle-section">
                        <h3>Toggle Widgets</h3>
                        <div id="widget-toggle-container"></div>
                    </div>

                    <br>
                    
                    <!-- BACKGROUND SETTINGS SECTION (empty container) -->
                    <div>
                        <h3>Change Background</h3>
                        <div>
                          <label>
                            <input type="radio" name="bgType" value="color" checked onchange="renderOptions(this.value)">
                            Background Color
                          </label>
                          <br>
                          <label>
                            <input type="radio" name="bgType" value="image" onchange="renderOptions(this.value)">
                            Background Image
                          </label>
                        </div>
                      
                        <div id="optionsContainer"></div>
                    </div>
                </aside>

                <!-- MAIN CONTENT AREA -->
                <!-- Two-column layout starts here -->
                <div class="columns">

                    <!-- LEFT COLUMN: Essentials -->
                    <section class="left-column">
                        
                        <!-- <SEARCH> -->
                            <section aria-labelledby="search-heading">
                                <h2 id="search-heading">Private Web Search</h2>

                                <!-- Search form with dropdown and input field -->
                                <form id="search-form" autocomplete="off" >
                                    <!-- Dropdown for selecting search engine -->
                                    <select id="search-engine">
                                        <option value="ddg">DuckDuckGo</option>
                                        <option value="brave">Brave Search</option>
                                        <option value="startpage">Startpage</option>
                                    </select>
                                    
                                    <!-- Input field for entering search query -->
                                    <input type="text" id="search-input" placeholder="Search..."  />
                                    
                                    <!-- Radio buttons for open mode -->
                                    <div>
                                        <label><input type="radio" name="tab-mode" value="same" checked> Same Tab</label>
                                        <label><input type="radio" name="tab-mode" value="new"> New Tab</label>
                                    </div>

                                    <!-- Submit button to trigger the search -->
                                    <button type="submit">Search</button>
                                </form>
                            </section>
                        <!-- </SEARCH> -->

                        <!-- <SHORTCUTS> -->
                            <section aria-labelledby="shortcuts-heading">
                                <h2 id="shortcuts-heading">My Shortcuts</h2>

                                <!-- Where all folders and shortcuts will be displayed -->
                                <div id="shortcuts"></div><br>

                                <!-- Button to toggle the visibility of the form section -->
                                <button id="toggleFormBtn">＋</button>

                                <!-- The container for the two forms: Add Shortcut and Add Folder -->
                                <div id="formContainer" style="display: none; margin-top: 10px;">
                                    
                                    <h3>Add Shortcut or Folder</h3>

                                    <!-- Form to add a new shortcut (name + URL) -->
                                    <form id="shortcutForm" autocomplete="off">
                                        <!-- Input for shortcut name -->
                                        <input type="text" id="name" placeholder="Shortcut Name" required>
                                        <!-- Input for shortcut URL -->
                                        <input type="url" id="url" placeholder="https://example.com" required>
                                        <!-- Dropdown to choose which folder to add the shortcut into -->
                                        <select id="parentFolder">
                                            <option value="">(Root)</option>
                                        </select>
                                        <!-- Submit button -->
                                        <button type="submit">Add Shortcut</button>
                                    </form>

                                    <!-- Separate form to add a new folder -->
                                    <form id="folderForm" style="margin-top: 10px;" autocomplete="off">
                                        <!-- Input for folder name -->
                                        <input type="text" id="folderName" placeholder="Folder Name" required>
                                        <!-- Dropdown to choose the parent folder for this new folder -->
                                        <select id="folderParent">
                                            <option value="">(Root)</option>
                                        </select>
                                        <!-- Submit button -->
                                        <button type="submit">Add Folder</button>
                                    </form>
                                </div>
                            </section>
                        <!-- </SHORTCUTS> -->

                    </section>

                    <!-- RIGHT COLUMN: Widgets -->
                    <section class="right-column">
                        
                        <!-- <CLOCK WIDGET> -->
                            <section id="clock-widget-wrapper">
                                <h2 id="clock-heading">Clock</h2>
                                <!-- Insert your clock widget here -->
                                <div id="clock-widget"></div>
                                <div id="date-widget" ></div>
                            </section>
                        <!-- </CLOCK WIDGET> -->

                        <!-- <QURAN WIDGET> -->
                            <section id="Quran-widget-wrapper">
                                <div id="Quran-widget">
                                    <h2>Qur'anic Ayah of the Day</h2>
                                    <p id="ayah-arabic" style="font-size: 1.5em;"></p>
                                    <p id="ayah-translation"></p>
                                    <small id="ayah-info"></small>
                                </div>                                  
                            </section>
                        <!-- </QURAN WIDGET> -->

                        <!-- <WEATHER WIDGET> -->
                            <section id="weather-widget-wrapper">
                                <h2>🌤️ My Weather Widgets</h2>

                                <!-- Widget container that always stays visible -->
                                <div id="widgetContainer"></div>

                                <!-- Toggle button to show/hide the widget creator interface -->
                                <button id="toggleBtn">Show Widget Creator</button>

                                <!-- Widget creator interface (toggleable) -->
                                <div id="widgetCreator" style="display: none;">
                                    <div class="widget-actions">
                                        <button onclick="window.open('https://www.aqi.in/aqi-widget', '_blank')">Create Widget on AQI.in</button>
                                    </div>

                                    <label for="widgetInput"><strong>Paste your AQI widget code here:</strong></label><br>
                                    <textarea id="widgetInput" placeholder="Paste widget code from aqi.in..."></textarea><br>
                                    <button id="saveBtn">Add Widget</button>
                                </div>

                            </section>
                        <!-- </WEATHER WIDGET> -->

                        <!-- <NEWS WIDGET> -->
                            <section id="news-widget-wrapper">
                                <h2>Latest News</h2>
                                <div id="news-widget">Loading news...</div>
                            </section>
                        <!-- </NEWS WIDGET> -->

                        <!-- <PROTON SUITE WIDGET> -->
                            <section id="proton-apps-wrapper">
                                <h2 id="">Proton Suite</h2>
                                <div class="app-grid" id="proton-apps"></div>
                            </section>
                        <!-- </PROTON SUITE WIDGET> -->

                        <!-- <NOTES WIDGET> -->
                            <section id="notes-area-wrapper">
                                <h2 id="">My Notes</h2>
                                <textarea id="notes-area" placeholder="Start typing..."></textarea>
                            </section>
                        <!-- </NOTES WIDGET> -->

                    </section>
                </div>
        </main>

        <script type="module" src="main.js"></script>
    </body>
</html>
